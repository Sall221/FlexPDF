# netlify.toml
# Production configuration for FlexPDF on Netlify

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Webhooks and API endpoints routing
[[redirects]]
  from = "/webhooks/saspay"
  to = "/.netlify/functions/saspay-webhook"
  status = 200

[[redirects]]
  from = "/api/webhooks/saspay"
  to = "/.netlify/functions/saspay-webhook"
  status = 200

[[redirects]]
  from = "/api/saspay/webhook"
  to = "/.netlify/functions/saspay-webhook"
  status = 200

[[redirects]]
  from = "/payments/softpay/initialize/*"
  to = "/.netlify/functions/saspay-initialize"
  status = 200

[[redirects]]
  from = "/api/payments/softpay/initialize/*"
  to = "/.netlify/functions/saspay-initialize"
  status = 200

[[redirects]]
  from = "/api/saspay/initiate"
  to = "/.netlify/functions/saspay-initialize"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
